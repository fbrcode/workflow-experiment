[project]
name = "wfx-kestra"
version = "0.1.0"
description = "Kestra implementation (Phase 3): the Python namespace files and their tests"
requires-python = ">=3.12,<3.13"
dependencies = []  # stdlib only: the script tasks run in a stock python image

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["files"]
testpaths = ["tests"]

[tool.ruff]
extend = "../ruff.toml"
