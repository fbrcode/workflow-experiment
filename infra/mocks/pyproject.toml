[project]
name = "wfx-mocks"
version = "0.1.0"
description = "Local mock services (Telegram Bot API, Gemini API) for the Kestra vs Prefect experiment"
requires-python = ">=3.12,<3.13"
dependencies = []  # stdlib only: the runtime image installs nothing

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend = "../../ruff.toml"
